[workspace]
resolver = "2"
members = ["crates/sweep-core", "crates/sweep-malware", "crates/sweep-cli", "crates/sweep-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
plist = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
unicode-normalization = "0.1"
yara-x = "1.24"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }
